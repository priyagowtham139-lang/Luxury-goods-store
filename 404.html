<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page Not Found | Stackly Florence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300..900&family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/nav.css">
  <style>
    .err-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .err-content {
      max-width: 620px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .err-logo-link {
      display: flex;
      justify-content: center;
      align-items: center;
      width: fit-content;
      margin: 0 auto 24px;
      text-decoration: none;
    }
    .err-logo {
      margin: 0;
      display: block;
      height: clamp(48px, 8vw, 66px);
      width: auto;
      object-fit: contain;
    }
    /* On the 404 page the brand logo belongs in the centre of the page,
       not duplicated in the corner navigation. */
    .page-404 .desktop-nav-404 .logo {
      display: none !important;
    }
    .err-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 7px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      color: var(--or, #c4572e);
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(52, 49, 47, 0.06);
    }
    .err-title {
      font-family: var(--disp, 'Abril Fatface', Georgia, serif);
      font-size: clamp(90px, 14vw, 150px);
      line-height: 0.95;
      letter-spacing: 2px;
      color: var(--ink, #353331);
      margin: 0 0 16px;
      text-shadow: 4px 4px 0 rgba(255, 255, 255, 0.8);
    }
    .err-sub {
      font-size: 16.5px;
      line-height: 1.6;
      color: var(--ink, #353331);
      margin: 0 auto 36px;
      max-width: 520px;
    }
    .err-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .err-actions .blob {
      padding: 16px 32px;
      border-radius: 99px;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(53, 51, 49, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .err-actions .blob:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(53, 51, 49, 0.18);
    }
    .err-actions .blob:active {
      transform: translateY(1px);
    }
    .err-actions .blob i {
      font-size: 15px;
    }
    .desktop-nav-404 {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }
    @media (max-width: 1000px) {
      .desktop-nav-404 {
        display: none !important;
      }
      /* Keep the hamburger, remove the corner logo so the centred logo
         below is the only brand mark on the page. */
      .page-404 .mobile-logo {
        display: none !important;
      }
      .page-404 .mobile-header-inner {
        justify-content: flex-end !important;
      }
    }
  </style>
</head>
<body class="page-404">
  <!-- Mobile Sticky Header (Mobile View: Logo on Left, Hamburger on Right) -->
  <header class="mobile-sticky-header" id="mobileStickyHeader" aria-label="Mobile Navigation Header">
    <div class="mobile-header-inner">
      <a href="index.html" class="mobile-logo" aria-label="Stackly Home">
        <img src="assets/stackly-logo-recoloured.webp" alt="Stackly Florence">
      </a>
      <button class="hamburger-btn mobile-hamburger" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileDrawer">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>
  <nav class="nav wrap desktop-nav-404">
    <a class="logo" href="index.html">
      <img src="assets/stackly-logo-recoloured.webp" alt="Stackly Florence">
    </a>
    <div class="nav-actions">
      <button class="hamburger-btn" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileDrawer">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </nav>

  <header class="g err-wrap">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap err-content">
      <a href="index.html" class="err-logo-link" aria-label="Stackly Florence Home">
        <img src="assets/stackly-logo-recoloured.webp" class="err-logo" alt="Stackly Florence">
      </a>
      <div class="err-badge">
        <i class="fa-solid fa-compass-drafting"></i>
        <span>Atelier Archival Notice</span>
      </div>
      <h1 class="err-title">404</h1>
      <p class="err-sub">
        The piece, commission, or archive page you requested has been retired from the active workbench. 
        You can return immediately to your previous section or browse our current numbered runs.
      </p>
      <div class="err-actions">
        <!-- Prominent Go Back Button falling back exactly to previous section without loading or scroll issues -->
        <button type="button" class="blob dk go-back-btn" id="goBackBtn">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Go Back</span>
        </button>
        <a href="index.html" class="blob wh">
          <i class="fa-solid fa-house"></i>
          <span>Return Home</span>
        </a>
      </div>
    </div>
  </header>

  <script src="js/mobile-nav.js"></script>
</body>
</html>
